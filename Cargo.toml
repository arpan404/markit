[workspace]
members = ["crates/markit", "crates/markit-ffi", "crates/markit-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/arpan404/markit"

[workspace.dependencies]
markit = { path = "crates/markit" }
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html", "simd"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
