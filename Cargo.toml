[workspace]
members = ["crates/markit", "crates/markit-ffi", "crates/markit-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/arpan404/markit"

[workspace.dependencies]
markit = { path = "crates/markit" }
pulldown-cmark = { version = "0.13.0", default-features = false, features = ["html", "simd"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Size-first build for the web package: whole-program LTO, size-optimized code,
# no symbol names. `wasm-opt -Oz` on top made the gzip size larger, so it is not run.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = true
panic = "abort"

# latex-rust with two size and startup changes; see third_party/latex-rust/MARKIT.md.
[patch.crates-io]
latex-rust = { path = "third_party/latex-rust" }
