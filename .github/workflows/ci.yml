name: Renderer
on:
  push:
  pull_request:
jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked
      - run: cargo install wasm-bindgen-cli --version "$(cargo tree -p markit-wasm --depth 1 | sed -n 's/.*wasm-bindgen v\([^ ]*\).*/\1/p')" --locked
      - run: ./scripts/build-web.sh
      - run: npm --prefix web ci
      - run: cd web && npx playwright install --with-deps chromium
      - run: npm --prefix web test
      - run: cd web && npm pack --dry-run
      - run: MARKIT_FEATURES=grammars ./scripts/build-web.sh
  ios:
    strategy:
      matrix:
        grammar_features: ["", "grammars"]
    env:
      MARKIT_FEATURES: ${{ matrix.grammar_features }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - run: ./scripts/package-notices.sh
      - run: cargo build -p markit-ffi --release --locked --features "$MARKIT_FEATURES"
      - run: MARKIT_SOURCE_BRIDGE=1 swift test --package-path platforms/ios -Xlinker "$PWD/target/release/libmarkit_ffi.a"
      - run: ./scripts/build-ios.sh
      - run: brew install xcodegen
      - run: xcodegen generate --spec examples/ios/project.yml
      - run: xcodebuild -project examples/ios/MarkitDemo.xcodeproj -scheme MarkitDemo -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
  android:
    strategy:
      matrix:
        grammar_features: ["", "grammars"]
    env:
      MARKIT_FEATURES: ${{ matrix.grammar_features }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "ndk;27.1.12297006" "platforms;android-36" "build-tools;35.0.0"
      - run: ./scripts/build-android.sh
      - run: platforms/android/gradlew -p platforms/android :markit:assembleDebug :markit:assembleDebugAndroidTest :demo:assembleDebug --no-daemon
