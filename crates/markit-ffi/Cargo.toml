[package]
name = "markit-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C and Android JNI bridges for Markit"

[lib]
name = "markit_ffi"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
markit.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[features]
default = []
grammars = ["markit/grammars"]
